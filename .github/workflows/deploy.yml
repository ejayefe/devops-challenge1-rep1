name: Build and deploy to ECS

on:
  push:
    branches: [gitops]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  id-token: write # lets the job request a GitHub OIDC token
  contents: read

concurrency:
  group: ecs-deploy # one deploy at a time; a new push waits its turn
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: devops-challenge1-rep1-cluster
  BACKEND_REPO: devops-challenge1-rep1/backend
  FRONTEND_REPO: devops-challenge1-rep1/frontend
  BACKEND_SERVICE: devops-challenge1-rep1-backend
  FRONTEND_SERVICE: devops-challenge1-rep1-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Get temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$BACKEND_REPO:$IMAGE_TAG -t $REGISTRY/$BACKEND_REPO:latest ./backend
          docker push $REGISTRY/$BACKEND_REPO:$IMAGE_TAG
          docker push $REGISTRY/$BACKEND_REPO:latest

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg REACT_APP_API_URL=http://${{ vars.ALB_DNS_NAME }}:8080 \
            -t $REGISTRY/$FRONTEND_REPO:$IMAGE_TAG -t $REGISTRY/$FRONTEND_REPO:latest ./frontend
          docker push $REGISTRY/$FRONTEND_REPO:$IMAGE_TAG
          docker push $REGISTRY/$FRONTEND_REPO:latest

      # ---------- Backend first, so the API is ready before the new frontend ----------
      - name: Download current backend task definition
        run: |
          aws ecs describe-task-definition --task-definition $BACKEND_SERVICE \
            --query taskDefinition > backend-task-def.json

      - name: Put new image into backend task definition
        id: backend-td
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-def.json
          container-name: backend
          image: ${{ steps.ecr.outputs.registry }}/${{ env.BACKEND_REPO }}:${{ env.IMAGE_TAG }}

      - name: Deploy backend
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend-td.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.BACKEND_SERVICE }}
          wait-for-service-stability: true

      # ---------- Frontend ----------
      - name: Download current frontend task definition
        run: |
          aws ecs describe-task-definition --task-definition $FRONTEND_SERVICE \
            --query taskDefinition > frontend-task-def.json

      - name: Put new image into frontend task definition
        id: frontend-td
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-def.json
          container-name: frontend
          image: ${{ steps.ecr.outputs.registry }}/${{ env.FRONTEND_REPO }}:${{ env.IMAGE_TAG }}

      - name: Deploy frontend
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend-td.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.FRONTEND_SERVICE }}
          wait-for-service-stability: true
# trigger
